services:
  db:
    image: mysql:8.0
    container_name: my-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: parser_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysecretpassword || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s

  phpmyadmin:
    image: phpmyadmin
    container_name: my-phpmyadmin-compose
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  parser:
    build: .
    container_name: my-parser-compose
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: